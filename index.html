<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion d'Événements</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="container">
        <!-- En-tête -->
        <header class="header">
            <h1>🎉 Gestion d'Événements</h1>
            <p>Créez et gérez vos événements facilement</p>
        </header>

        <!-- Section : Formulaire de création d'événement -->
        <section class="section">
            <h2>➕ Créer un événement</h2>
            <form id="event-form" class="form">
                <div class="form-group">
                    <label for="event-titre">Titre *</label>
                    <input type="text" id="event-titre" required>
                </div>

                <div class="form-group">
                    <label for="event-description">Description *</label>
                    <textarea id="event-description" rows="3" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event-date">Date *</label>
                        <input type="datetime-local" id="event-date" required>
                    </div>

                    <div class="form-group">
                        <label for="event-lieu">Lieu *</label>
                        <input type="text" id="event-lieu" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="event-categorie">Catégorie *</label>
                        <select id="event-categorie" required>
                            <option value="conférence">Conférence</option>
                            <option value="sport">Sport</option>
                            <option value="atelier">Atelier</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="event-capacite">Capacité max *</label>
                        <input type="number" id="event-capacite" min="1" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Créer l'événement</button>
            </form>

            <div id="event-message" class="message"></div>
        </section>

        <!-- Section : Filtres -->
        <section class="section">
            <h2>🔍 Filtrer les événements</h2>
            <div class="filters">
                <select id="filter-categorie" class="filter-select">
                    <option value="">Toutes les catégories</option>
                    <option value="conférence">Conférence</option>
                    <option value="sport">Sport</option>
                    <option value="atelier">Atelier</option>
                    <option value="autre">Autre</option>
                </select>

                <select id="filter-date" class="filter-select">
                    <option value="tous">Tous les événements</option>
                    <option value="avenir">À venir</option>
                    <option value="passes">Passés</option>
                </select>

                <button id="filter-reset" class="btn btn-secondary">Réinitialiser</button>
            </div>
        </section>

        <!-- Section : Liste des événements -->
        <section class="section">
            <h2>📅 Liste des événements</h2>
            <div id="events-list" class="events-grid">
                <p class="empty-state">Aucun événement pour le moment. Créez-en un !</p>
            </div>
        </section>

        <!-- Section : Inscription (cachée par défaut) -->
        <section id="inscription-section" class="section" style="display: none;">
            <h2>✍️ S'inscrire à l'événement</h2>
            <h3 id="inscription-event-title"></h3>

            <form id="inscription-form" class="form">
                <div class="form-group">
                    <label for="user-nom">Nom complet *</label>
                    <input type="text" id="user-nom" required>
                </div>

                <div class="form-group">
                    <label for="user-email">Email institutionnel *</label>
                    <input type="email" id="user-email" placeholder="soussomaine@saintjeaningenieur.org" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Confirmer l'inscription</button>
                    <button type="button" id="inscription-cancel" class="btn btn-secondary">Annuler</button>
                </div>
            </form>

            <div id="inscription-message" class="message"></div>
        </section>
    </div>

    <!-- Script principal (compilé depuis TypeScript) -->
    <script type="module" src="/dist/main.js"></script>
</body>

</html>
